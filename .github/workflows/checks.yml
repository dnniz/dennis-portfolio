name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Corta la ejecucion anterior del mismo ref. Sin esto, cada push deja un run
# huérfano consumiendo los runners hasta que termina, y el badge del PR muestra
# el resultado de un commit viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm se fija por `packageManager` en package.json, asi que corepack usa la
  # version del proyecto y no la que venga en la imagen del runner.
  NODE_VERSION: "22"

jobs:
  quality:
    name: tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm exec tsc --noEmit

      - name: tests
        run: pnpm exec vitest run

      - name: build
        run: pnpm build

  audit:
    name: auditoria de dependencias
    runs-on: ubuntu-latest
    # No hace falta esperar al build para saber si una dependencia trae un
    # CVE conocido. Va en paralelo.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (solo errores altos o criticos)
        # --audit-level high deja pasar los avisos moderados: en un portfolio
        # estatico, unmoderate transitivo que no se ejecuta no justifica un
        # rojo permanente que nadie va a mirar.
        run: pnpm audit --audit-level high
        continue-on-error: true

  a11y:
    name: accesibilidad en navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: instalar navegadores
        run: pnpm exec playwright install --with-deps chromium

      - name: axe en las dos rutas
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: la imagen de Coolify construye
    runs-on: ubuntu-latest
    # El Dockerfile es lo que corre en produccion y el unico paso que no cubren
    # ni el build de Next ni los tests: aqui es donde se descubre que
    # pnpm-workspace.yaml no llego a la capa de deps.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: arrancar y comprobar que responde
        run: |
          docker run -d --name portfolio -p 3000:3000 portfolio:ci
          # Se espera al healthcheck en vez de a un sleep fijo: un sleep de 10s
          # es o demasiado corto en un runner lento o un minuto de sobra en uno
          # rapido, y ambos casos hacen el job fragil.
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/en; then
              echo "el contenedor responde"
              docker rm -f portfolio
              exit 0
            fi
            sleep 2
          done
          echo "el contenedor no respondio:"
          docker logs portfolio
          exit 1
